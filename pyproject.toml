[project]
name = "capacita"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dante", email = "master.neo16@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
capacita = "capacita:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
